name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: detekt + spotless
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run detekt
        run: ./gradlew detektCheck --no-daemon --stacktrace

      - name: Run spotless
        run: ./gradlew spotlessCheck --no-daemon --stacktrace

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: |
            **/build/reports/detekt/
          if-no-files-found: ignore

  build:
    name: shadow JAR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Shadow JAR
        run: ./gradlew shadowJar --no-daemon --stacktrace

      - name: Smoke test
        run: java -jar app/build/libs/*.jar --help

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: egs-engine.jar
          path: app/build/libs/*.jar

  test:
    name: all tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Run ALL module tests (golden + unit + konsist + init + base).
      # EGS_TEMPLATE_ROOT is intentionally unset so golden compares against bundled templates.
      - name: Run tests
        run: ./gradlew test --no-daemon --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            **/build/reports/tests/test
          if-no-files-found: ignore
