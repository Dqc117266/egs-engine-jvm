build:
  maxIssues: 0

# egs-engine 是代码生成引擎，scaffold（data/domain/presentation）+ analyzer/script 等模块
# 大量含模板构建、嵌套解析、交互式命令逻辑，复杂度技术债较大，纳入 P1/P2 统一重构。
# 当前先在这些包（及测试 test/）上豁免复杂度规则，避免阻塞 CI；新代码（feature/base 等）仍受约束。
complexity:
  LongMethod:
    threshold: 60
    excludes:
      - '**/test/**'
      - '**/scaffold/**'
      - '**/analyzer/**'
      - '**/script/**'
  LongParameterList:
    functionThreshold: 6
    # generator/Scaffolder/解析器构造器与函数参数较多，宽松一档
    constructorThreshold: 12
    excludes:
      - '**/scaffold/**'
      - '**/analyzer/**'
  ComplexCondition:
    threshold: 5
    excludes:
      - '**/scaffold/**'
      - '**/analyzer/**'
  CyclomaticComplexMethod:
    excludes:
      - '**/scaffold/**'
      - '**/analyzer/**'
      - '**/script/**'
  TooManyFunctions:
    thresholdInFiles: 15
    thresholdInClasses: 15
    thresholdInInterfaces: 15
    thresholdInObjects: 15
    thresholdInEnums: 15
    excludes:
      - '**/scaffold/**'
      - '**/analyzer/**'
  NestedBlockDepth:
    excludes:
      - '**/scaffold/**'
      - '**/init/domain/**'

style:
  MaxLineLength:
    maxLineLength: 150
    excludes:
      - '**/scaffold/**'
  WildcardImport:
    active: false
  MagicNumber:
    active: false
  ReturnCount:
    max: 5
    excludes:
      - '**/scaffold/**'
  ForbiddenComment:
    active: false
  LoopWithTooManyJumpStatements:
    active: false
  UnusedPrivateProperty:
    excludes:
      - '**/scaffold/**'
  UnusedParameter:
    excludes:
      - '**/scaffold/**'
      - '**/init/**'

exceptions:
  SwallowedException:
    excludes:
      - '**/scaffold/**'
      - '**/script/**'
      - '**/base/**'
  TooGenericExceptionCaught:
    excludes:
      - '**/scaffold/**'
      - '**/script/**'
      - '**/base/**'
      - '**/analyzer/**'

naming:
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][_A-Za-z0-9]*'
  FunctionNaming:
    ignoreAnnotated: ['Test']
  MatchingDeclarationName:
    active: false
